name: "Env Sync Gate"
description: "Scan code for process.env and os.environ to prevent missing env variable startup crashes"
branding:
  icon: "lock"
  color: "orange"
inputs:
  path:
    description: "Directory path to scan"
    required: false
    default: "."
  template:
    description: "Path to .env.example template file"
    required: false
    default: ".env.example"
  fail_on_missing:
    description: "Fail CI if uncommitted/undocumented env variables are detected"
    required: false
    default: "true"
  license_key:
    description: "OrderStream Pro/Enterprise license key (optional)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install env-sync-gate
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}
    - name: Run Env Sync Audit
      shell: bash
      env:
        ORDERSTREAM_LICENSE_KEY: ${{ inputs.license_key }}
      run: |
        FAIL_FLAG=""
        if [ "${{ inputs.fail_on_missing }}" = "true" ]; then
          FAIL_FLAG="--fail-on-missing"
        fi
        TEMPLATE_ARG=""
        if [ -f "${{ inputs.template }}" ]; then
          TEMPLATE_ARG="--template ${{ inputs.template }}"
        fi
        env-sync-gate scan \
          --path "${{ inputs.path }}" \
          $TEMPLATE_ARG \
          $FAIL_FLAG
